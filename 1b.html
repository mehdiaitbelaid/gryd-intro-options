<style>/* Generated by _mesh.py. The fill inside each pattern on guide page 25,
   measured off a 400 dpi render of the page and reproduced as a gradient
   so it stays smooth at hero size. Do not hand edit. */
:root{
  --fill-bars:linear-gradient(90deg,#E0D7CA 0%,#E6CEBB 25%,#EEA88D 50%,#EE8263 75%,#EC563E 100%);
  --fill-blades:linear-gradient(172deg,#E1D5C9 0%,#E5CDBA 25%,#E7A890 50%,#DC5E48 75%,#E64937 100%);
  --fill-bolt:linear-gradient(86deg,#E0D6C9 0%,#E7CDB9 25%,#EFAF95 50%,#F19D80 75%,#F18260 100%);
  --fill-chevrons:linear-gradient(255deg,#E8DBD1 0%,#E8CBB8 25%,#EA9E85 50%,#E25442 75%,#EB4A35 100%);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden}
body{background:var(--paper);color:var(--red110);font-family:"DM Sans",ui-sans-serif,system-ui,sans-serif}
/* pointer state, published on the root by the field script and read by the
   interactive variants. The defaults hold the field centred, so a page that
   never sees a pointer still composes. */
:root{--mx:50vw;--my:50vh;--px:.5;--py:.5;--sy:0}
/* every spotlight is one masked layer whose mask slides, rather than a gradient
   rebuilt each frame, and it drifts on its own until a fine pointer takes over */
.spot{position:absolute;inset:0;
  -webkit-mask-image:radial-gradient(circle at 50% 50%,#000 0%,rgba(0,0,0,.55) 42%,rgba(0,0,0,0) 72%);
  mask-image:radial-gradient(circle at 50% 50%,#000 0%,rgba(0,0,0,.55) 42%,rgba(0,0,0,0) 72%);
  -webkit-mask-size:640px 640px;mask-size:640px 640px;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:50% 50%;mask-position:50% 50%;
  animation:spotdrift 19s ease-in-out infinite}
html.pointer-live .spot{animation:none;
  -webkit-mask-position:calc(var(--mx) - 320px) calc(var(--my) - 320px);
  mask-position:calc(var(--mx) - 320px) calc(var(--my) - 320px)}
@keyframes spotdrift{
  0%,100%{-webkit-mask-position:22% 30%;mask-position:22% 30%}
  50%{-webkit-mask-position:74% 68%;mask-position:74% 68%}}
/* a layer that rides the pointer as a transform, which is the cheap way to move
   a large soft shape every frame */
.track{position:absolute;left:0;top:0;width:100%;height:100%;
  transform:translate3d(calc(var(--mx) - 50vw),calc(var(--my) - 50vh),0);
  transition:transform .18s linear}

/* the animated field. It is painted once, sits behind everything and keeps
   running after the opening hands over, so the hero inherits the same motion
   rather than the intro fading to flat paper. */
.field{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--paper)}
/* the readability wash, eased in with the hero so the field is unveiled during
   the opening and only knocked back once there is copy to protect */
.hero-scrim{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;
  transition:opacity .6s cubic-bezier(.22,.61,.36,1)}
body.intro-rise .hero-scrim{opacity:1}
.gryd-intro{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;
  background:transparent;opacity:1;transition:opacity .7s cubic-bezier(.22,.61,.36,1),visibility .7s}
.gryd-intro.out{opacity:0;visibility:hidden;pointer-events:none}
.gryd-intro-inner{position:relative;z-index:2;display:flex;align-items:center;gap:14px}
.gryd-intro-mark{width:46px;height:46px;color:var(--flare);animation:gryd-intro-spin 2.4s linear infinite}
.gryd-intro-word{height:34px;width:auto;aspect-ratio:407.6/169.3;color:var(--red110)}
@keyframes gryd-intro-spin{to{transform:rotate(360deg)}}
.gryd-intro-skip{position:absolute;right:24px;bottom:22px;z-index:3;appearance:none;border:0;
  background:rgba(78,37,27,.42);color:#fff;font:inherit;font-size:13px;line-height:1;padding:10px 16px;
  border-radius:999px;cursor:pointer;transition:background-color .2s linear}
.gryd-intro-skip:hover,.gryd-intro-skip:focus-visible{background:rgba(78,37,27,.68)}
/* reversed pairing where the field is dark or fully saturated */
.rev .gryd-intro-word{color:#ffffff}
.allwhite .gryd-intro-mark{color:#ffffff}
/* the hero the field hands over to, carrying the real page copy so the
   legibility call is made against the moving field rather than a placeholder */
.stub{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;padding:0 28px}
.stub .in{max-width:1200px;margin:0 auto;width:100%}
.stub h1{font-family:"Borna","DM Sans",sans-serif;font-weight:500;letter-spacing:-.025em;line-height:.98;
  font-size:clamp(40px,6.2vw,92px);margin:0;max-width:15ch}
.tail{position:relative;z-index:2;height:70vh}
/* the field answers the scroll into the hero, a slow lift and swell */
html.pointer-live .field{transform:translate3d(0,calc(var(--sy) * -4vh),0) scale(calc(1 + var(--sy) * .06));
  transform-origin:50% 42%}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.btn{display:inline-block;text-decoration:none;font-size:15px;font-weight:500;padding:14px 26px;
  border-radius:999px;background:var(--flare);color:#ffffff}
.btn.ghost{background:transparent;color:var(--red110);box-shadow:inset 0 0 0 1px var(--stone-mid)}
/* reversed hero, for the fields dark or saturated enough to need it. Every pair
   here is one the guide's contrast table already approves. */
body.rev-hero .stub h1{color:#ffffff}
body.rev-hero .stub .btn.ghost{color:#ffffff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.55)}
/* on the full Solar Flare field a flare button would vanish, so the primary
   inverts to paper with Red 110 type, which the table approves on flare */
body.on-flare .stub .btn:not(.ghost){background:var(--paper);color:var(--red110)}
body.on-flare .stub .btn.ghost{color:#ffffff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.7)}
body.intro-playing{overflow:hidden}
body.intro-playing .stub{transform:translateY(24px);opacity:0}
body.intro-rise .stub{transform:none;opacity:1;
  transition:transform .6s cubic-bezier(.22,.61,.36,1),opacity .6s cubic-bezier(.22,.61,.36,1)}
@media (prefers-reduced-motion:reduce){
  .gryd-intro-mark{animation:none}
  .spot,.track{animation:none !important;transition:none !important}
  .field,.field *{animation:none !important;transition:none !important}
  .hero-scrim{opacity:1;transition:none}
}
@media (max-width:820px){
  .stub h1{font-size:clamp(34px,9vw,54px)}
}

/* ---- variant 1b: Flare breath, Double beat, two quick pulses then a long rest ---- */

.field{background:var(--paper)}
.v-breath{position:absolute;inset:-20%;
  background:radial-gradient(48% 48% at 50% 52%, rgba(255,85,50,.42) 0%, rgba(255,110,70,.26) 38%, rgba(242,222,217,.30) 62%, rgba(248,246,242,0) 80%);
  will-change:transform,opacity}

.v-breath{animation:beat 4.4s cubic-bezier(.3,.7,.3,1) infinite;transform-origin:42% 58%}
@keyframes beat{
  0%{transform:scale(.88);opacity:.6}
  10%{transform:scale(1.10);opacity:1}
  20%{transform:scale(.94);opacity:.78}
  30%{transform:scale(1.06);opacity:.96}
  44%{transform:scale(.90);opacity:.66}
  100%{transform:scale(.88);opacity:.6}}

.hero-scrim{background:linear-gradient(90deg,rgba(248,246,242,.90) 0%,rgba(248,246,242,.74) 42%,rgba(248,246,242,.10) 76%,rgba(248,246,242,0) 100%)}
</style>

<script>
(function(){
  var root=document.getElementById('grydIntro');
  var body=document.body;
  var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var HOLD=2600,FADE=700,finished=false,timer=null;
  body.classList.add('intro-playing');
  function finish(){
    if(finished)return;finished=true;if(timer)clearTimeout(timer);
    root.classList.add('out');
    body.classList.remove('intro-playing');body.classList.add('intro-rise');
    setTimeout(function(){if(root.parentNode)root.parentNode.removeChild(root);},FADE+60);
  }
  root.addEventListener('click',finish);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')finish();});
  // ?t=seconds freezes the field at one phase of its loop, so a still can be
  // captured on the beat rather than wherever the capture happens to land
  var ph=/[?&]t=(-?[\d.]+)/.exec(location.search);
  if(ph){
    var off=parseFloat(ph[1]);
    Array.prototype.forEach.call(document.querySelectorAll('.field *'),function(el){
      el.style.animationDelay='-'+off+'s';el.style.animationPlayState='paused';
    });
  }
  // ?hold parks the field open so a still can be captured mid animation
  if(/[?&]hold\b/.test(location.search))return;
  timer=setTimeout(finish,reduced?900:HOLD);
})();
</script>
